<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog tech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #1a3a5f; /* Azul escuro */
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        header p {
            margin-top: 10px;
            font-size: 1.1em;
            font-weight: 300;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        img {
            display: block;
            max-width: 100px; 
            width: 100%;       
            height: auto;
            margin: 20px 0;    
            border-radius: 8px; 
        }

        .img-placeholder {
            font-style: italic;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        article h2 {
            color: #1a3a5f;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .author {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content {
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <!-- A imagem foi movida para dentro do main e corrigida aqui embaixo -->
        <img src="img/v920-kul-52.jpg" alt="Ilustração sobre tecnologia">

        <article>
            <h2>Meu primeiro post</h2>
            <p class="author">Por: Egon henrique</p>
            <p class="content">
                Bem vindo ao meu novo blog! Aqui vou mostrar dicas de programação e curiosidades da área de tecnologia.
            </p>
        </article>
    </main>

</body>
</html>
